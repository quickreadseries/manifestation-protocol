:root{--bg:#f4f1eb;--card:#fffdf9;--ink:#20201e;--muted:#77736c;--line:#ded9d0;--accent:#222;--soft:#ebe7df}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif;letter-spacing:.01em}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.section-title{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:7px}.practice-line{font-family:Georgia,serif;font-size:17px;font-style:italic;margin-bottom:18px;color:#4d4943}.manifest{font-family:Georgia,serif;font-size:27px;line-height:1.38}.prompt{line-height:1.65}.timer{font-size:28px;font-variant-numeric:tabular-nums;margin:12px 0}.controls{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:11px 15px;cursor:pointer;color:var(--ink)}.btn.primary{background:#222;color:#fff;border-color:#222}.btn:disabled{opacity:.35;cursor:not-allowed}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;background:#faf8f3;padding:14px;font:15px/1.5 inherit;resize:vertical}
.daypicker{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;max-height:240px;overflow:auto;padding:4px 6px 6px 4px;scrollbar-gutter:stable}.num{width:100%;width:38px;height:34px;border:1px solid var(--line);background:transparent;border-radius:8px;cursor:pointer}.num.done{background:var(--soft);color:var(--ink);font-weight:600}.num.current,.num.current.done{background:#222!important;color:#fff!important;border:2px solid #222!important;font-weight:700;outline:2px solid #222;outline-offset:1px;box-shadow:inset 0 0 0 2px #fff}.num.locked{opacity:.42}#printJourney{display:none}@media print{body *{visibility:hidden!important}#printJourney,#printJourney *{visibility:visible!important}#printJourney{display:block!important;position:absolute;left:0;top:0;width:100%;padding:24px;font-family:Arial,sans-serif;color:#111;background:#fff}.print-day{break-inside:avoid;page-break-inside:avoid;border-bottom:1px solid #ccc;padding:0 0 18px;margin:0 0 18px}.print-day h2{font-size:16px;margin:0 0 8px}.print-day h3{font-size:11px;text-transform:uppercase;margin:7px 0 3px}.print-day p{font-size:12px;line-height:1.45;margin:3px 0}.print-note{white-space:pre-wrap}.print-complete{font-size:10px;color:#555;margin-top:6px}}

.complete{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:14px;padding:17px}.complete label{display:flex;align-items:center;gap:9px;cursor:pointer}.complete input{width:20px;height:20px;margin:0}.complete .action-note{font-size:12px;color:var(--muted);text-align:center;order:2}

<script>
const daysEN_PLACEHOLDER = null;
const daysEN = [
  ["I can pause and notice what is happening within me without needing to change it immediately.","Notice your thoughts, feelings, body, and surroundings in one ordinary moment.","Give one ordinary moment your full attention for one minute today."],
  ["I can notice the themes my mind returns to.","Observe the topics that occupy your thoughts most often and distinguish what happened from what you fear or anticipate.","When a thought returns today, name its topic without trying to solve it immediately."],
  ["I can speak to myself with honesty and kindness.","Recall how you speak to yourself when something goes wrong, and consider whether you would use those words with someone you care about.","Answer one self-critical thought as you would respond to someone close to you."],
  ["I am more than any single label I use to describe myself.","Notice how a label may fit one situation but not describe your whole self.","Replace one fixed label with a description of a specific behaviour."],
  ["I can recognise my strengths through what I actually do.","Recall moments when you handled a problem, helped someone, or followed through on something meaningful.","Notice one strength in action and name the specific behaviour that showed it."],
  ["I can look honestly at what I find difficult without judging my whole self.","Explore one quality or reaction that troubles you, when it appears, and whether you want to change it or understand it better.","Describe one difficult reaction without insulting yourself."],
  ["I am learning to notice my thoughts, words, and reactions with curiosity.","Review the first six days and notice which themes, surprises, or strengths appeared in your notes.","Choose one observation to carry into the next week without turning it into a task list."],
  ["Notice the subjects your thoughts return to most often. You do not need to change them or find a solution. For now, simply notice them.","Notice the subjects your thoughts return to most often.","When you notice a recurring thought today, name it calmly. You do not have to follow it or fight it."],
  ["Notice the situations in which you compare your life, appearance, achievements, or opportunities with those of other people.","Notice the situations in which you compare your life, appearance, achievements, or opportunities with those of other people.","When you notice yourself comparing today, ask: What does this situation tell me about what matters to me?"],
  ["Think about beliefs about yourself that sound similar to things you once heard from other people.","Think about beliefs about yourself that sound similar to things you once heard from other people.","Notice one belief today that you could treat as an opinion to examine rather than an unquestionable fact."],
  ["Notice the words you use to describe yourself. Do you ever say things like “I am shy”, “I always put things off”, or “I am not suited to this”?","Notice the words you use to describe yourself.","Instead of saying “That is just how I am”, try describing the specific situation: “Sometimes I react this way, but in other circumstances I can respond differently”."],
  ["Direct your attention towards things you can do, even if you do not usually consider them special achievements.","Direct your attention towards things you can do, even if you do not usually consider them special achievements.","Notice one thing you did well today. Instead of immediately moving on to the next task, take a moment to acknowledge your effort."],
  ["Notice how you describe yourself after a situation does not go the way you wanted.","Notice how you describe yourself after a situation does not go the way you wanted.","When a self-critical thought appears today, try describing the facts first. Give yourself a chance to see the situation more clearly before judging it."],
  ["Recall one specific situation from the past few days in which you reacted more strongly than you wanted to—for example, becoming irritated during a conversation or withdrawing when someone pointed something out.","Recall one specific situation from the past few days in which you reacted more strongly than you wanted to—for example, becoming irritated during a conversation or withdrawing when someone pointed something out.","If a similar situation happens again, try to notice the first sign of your reaction before responding. That moment of awareness may give you more options."],
  ["Notice what you do when you expect something uncomfortable. You might postpone a conversation, distract yourself with something else, agree just to keep the peace, or pretend the problem does not concern you.","Notice what you do when you expect something uncomfortable.","Today, notice one moment when you can pause and consider whether avoidance is actually helping you. You do not have to confront a difficult situation immediately—start by making a conscious choice."],
  ["Think of one specific matter you keep postponing or avoiding, even though it still matters to you.","Think of one specific matter you keep postponing or avoiding, even though it still matters to you.","If you still want to address it, choose one small step that does not require solving the entire matter."],
  ["Notice situations in which you assume you know what someone is thinking, what will happen, or how something will turn out.","Notice situations in which you assume you know what someone is thinking, what will happen, or how something will turn out.","Before treating something as certain today, try telling yourself: “This is one possibility. I may not know the whole situation yet”."],
  ["Think of something you would like to do or change, but immediately hear the thought: “I cannot do it” or “That is not for me”.","Think of something you would like to do or change, but immediately hear the thought: “I cannot do it” or “That is not for me”.","Choose one thing you can investigate before deciding whether that possibility is beyond your reach."],
  ["Notice whose opinions influence you most and in which situations you are especially afraid of being judged.","Notice whose opinions influence you most and in which situations you are especially afraid of being judged.","Before giving something up today because of other people's opinions, pause and consider whether your fear is based on facts or on a prediction."],
  ["Think of situations in which you feel at ease and do not need to prove anything.","Think of situations in which you feel at ease and do not need to prove anything.","Find one small opportunity today to express your opinion, interest, or need in a way that feels natural and safe for you."],
  ["Look back at your notes from the past three weeks. Do not look for perfect answers. Notice the themes that appeared most often.","Look back at your notes from the past three weeks.","Choose one observation you want to carry into the next stage. You do not need to change anything yet. It is enough to remember what you have learned to notice. Następny krok: przygotowanie pełnych dni 22–45 w tym samym formacie, z zachowaniem nowej terminologii i rozdzieleniem tematów. Treść nie została jeszcze wpisana do aplikacji ani do GitHuba."],
  ["Think about what gives your life meaning, even if other people might not consider it particularly important.","Think about what gives your life meaning, even if other people might not consider it particularly important.","Notice one thing you spend time on today. Is it connected to what truly matters to you?"],
  ["Think about the principles you would like to guide your choices. These might include freedom, connection, honesty, peace, growth, or creativity.","Think about the principles you would like to guide your choices.","Choose one small decision you can make today that reflects one of your values."],
  ["Notice the difference between what you genuinely want and what you feel you should want.","Notice the difference between what you genuinely want and what you feel you should want.","Write down one desire you want to explore further. You do not yet need to decide whether to pursue it."],
  ["Imagine an ordinary day that leaves you feeling, by the evening, that you have spent your time well.","Imagine an ordinary day that leaves you feeling, by the evening, that you have spent your time well.","Choose one element of that day that you can bring into your current routine, even in a small way."],
  ["Focus on the experiences you would like to have more often in your life.","Focus on the experiences you would like to have more often in your life.","Make a little room for one of these things today. It does not need to be a big change or take a long time."],
  ["Notice what takes up too much of your time, attention, or energy compared with what it gives you.","Notice what takes up too much of your time, attention, or energy compared with what it gives you.","Choose one thing you can deliberately give less time or attention to today."],
  ["Consider what a successful life means to you, regardless of how other people define it.","Consider what a successful life means to you, regardless of how other people define it.","Notice one way you are already living according to your own definition of success, even if it is something small."],
  ["Think about situations in which you agree to something even though you would rather say no or set different conditions.","Think about situations in which you agree to something even though you would rather say no or set different conditions.","If an appropriate opportunity arises, express one need or boundary calmly and clearly."],
  ["Notice which activities, interactions, or experiences leave you feeling more engaged, interested, or fulfilled.","Notice which activities, interactions, or experiences leave you feeling more engaged, interested, or fulfilled.","Make time for one of these things in the coming days."],
  ["Notice responsibilities, situations, or recurring demands that leave you feeling overwhelmed, frustrated, or discouraged.","Notice responsibilities, situations, or recurring demands that leave you feeling overwhelmed, frustrated, or discouraged.","Choose one small change that could make this part of your everyday life easier."],
  ["Think about what you would like to discover, try, or understand, even if you do not yet have a specific plan.","Think about what you would like to discover, try, or understand, even if you do not yet have a specific plan.","Spend a few minutes exploring one of these things. You could read, look for information, or talk to someone with experience in that area."],
  ["Choose one matter you have been postponing for a long time, even though you still consider it important.","Choose one matter you have been postponing for a long time, even though you still consider it important.","Decide whether you still want to address it. If you do, write down the smallest specific step that would help you get started."],
  ["Choose one area in which you would like to see a change. You do not yet need to know how to achieve it.","Choose one area in which you would like to see a change.","Write one sentence describing the change you want. For now, you do not need to create a plan for achieving it."],
  ["Try to look beyond the result itself. Consider why this change matters to you.","Try to look beyond the result itself.","Write one sentence reminding you why this change matters to you. Return to it when you need to reconnect with your direction."],
  ["Think not only about what you would like to change, but also about how you would like to feel in your everyday life.","Think not only about what you would like to change, but also about how you would like to feel in your everyday life.","Choose one small moment or gesture that could help you experience a little more of one of these feelings today."],
  ["Think about a situation connected to the change you want that has been taking up a lot of your attention lately.","Think about a situation connected to the change you want that has been taking up a lot of your attention lately.","Choose one thing from the first section that you can realistically influence. Consider one small step you could take."],
  ["Return to the desire or direction you have been considering. Examine what makes you want to pursue it.","Return to the desire or direction you have been considering.","You do not need to make a final decision today. Write down what has become clearer and what still needs consideration."],
  ["Consider how you will recognise that you are moving closer to what you want.","Consider how you will recognise that you are moving closer to what you want.","Choose one sign you can observe over the coming weeks."],
  ["Imagine yourself one year from now if you gradually make decisions aligned with your values and work towards your chosen direction.","Imagine yourself one year from now if you gradually make decisions aligned with your values and work towards your chosen direction.","Choose one element of this vision that you can begin building now."],
  ["Think about the resources that would help you move closer to your chosen direction.","Think about the resources that would help you move closer to your chosen direction.","Identify one specific way to obtain the resource you need or ask for appropriate support."],
  ["Look at the change you want and consider more than one path that could bring you closer to it.","Look at the change you want and consider more than one path that could bring you closer to it.","Choose one possibility you want to explore further. You do not have to commit to it yet."],
  ["Think about what you value in your current everyday life and what you would not want to lose while making a change.","Think about what you value in your current everyday life and what you would not want to lose while making a change.","When making one decision today, remember both what you want to change and what you want to protect."],
  ["Return to your values, desires, needs, and vision of a good day. Consider what connects these elements.","Return to your values, desires, needs, and vision of a good day.","Write one sentence describing the direction you want to explore further. Allow yourself to change it in the future if you gain new experiences."],
  ["Review your notes from the past few weeks. Notice the values, desires, and needs that appeared most often.","Review your notes from the past few weeks.","Choose one direction to carry into the next stage. It does not need to be final or perfectly defined. It is enough that it matters to you and that you want to explore it further. Kolejny etap to SEE — dni 46–70, w którym przejdziemy do pracy z przekonaniami, interpretacjami i nowymi sposobami reagowania."],
  ["When you think about the direction you want to take, different beliefs may arise. Some encourage you, while others suggest that something is too difficult or not meant for you. Today, explore the beliefs that influence your decisions.","• What belief comes up most often when I think about my goal?\n• How does it influence my behaviour?\n• What might I do if I stopped treating this thought as unquestionable truth?","Write down one belief you would like to understand better. You do not need to change it yet."],
  ["Not all beliefs come from our own experiences. Sometimes we inherit them from family, school, our surroundings or culture. Hearing something repeatedly does not mean it has to define our lives.","• Where might the belief I am examining have come from?\n• Did someone communicate it to me directly or indirectly?\n• Does it still fit the person I am today?","When the thought appears again, remind yourself: “This is a belief I learned, not necessarily a fact.”"],
  ["The same event can have many meanings. A fact describes what actually happened. An interpretation is the meaning we attach to it. Separating the two can help us see a situation more clearly.","• What recent event triggered a strong reaction in me?\n• What is fact in this situation, and what is my interpretation?\n• What other meaning could I consider?","In your next difficult situation, write two sentences: “What happened” and “What I told myself about it.”"],
  ["When we strongly believe something, it is easy to notice information that confirms it and overlook what does not fit. Today, examine one belief as if you were gathering information rather than trying to prove yourself right.","• What experiences seem to support this belief?\n• Are there situations that contradict it?\n• Am I considering all relevant information, or only what fits my view?","Add one fact that supports your belief and one that complicates or challenges it."],
  ["The first explanation that comes to mind is not always the only one. If someone does not reply to a message, we might assume they are ignoring us. There may be other reasons. Considering alternatives does not mean ignoring facts; it means making room for what we do not yet know.","• What interpretation do I tend to make in difficult situations?\n• What are at least two other possible explanations?\n• How might I respond if I did not immediately assume the worst-case scenario?","Choose one current situation and write down three possible explanations for what happened."],
  ["The inner critic often tries to protect us from mistakes, rejection or disappointment. Yet its approach can discourage us and undermine our confidence. We can treat its words as a signal, not an instruction we must obey.","• What do I say to myself when something does not work out?\n• What might this voice be trying to protect me from?\n• Is there a way to acknowledge its concerns without giving up on action?","Choose one critical sentence you often tell yourself. Rewrite it in a more balanced and helpful way."],
  ["Sometimes we treat a single experience as proof that things will always be the same. One setback becomes “I never succeed”, and one critical comment becomes “I am not good enough”. Today, examine whether your conclusions reflect the full range of your experiences.","• Is my belief based on one event or on many experiences?\n• Do I also remember situations that turned out differently?\n• What information would help me look at this more objectively?","Notice one generalisation you use, such as “always”, “never” or “everyone”. Check whether it truly describes the facts."],
  ["We often wait for certainty before making a decision. Yet many important choices involve unknowns. This is not about taking reckless risks, but about recognising what information we genuinely need and what cannot be predicted.","• Where am I waiting for certainty that I may never obtain?\n• What information do I genuinely need before deciding?\n• What small, sensible step can I take despite the uncertainty?","Instead of making a final decision immediately, find one way to gather more information or test an idea on a small scale."],
  ["Fear of failure can lead us to prepare endlessly, postpone decisions or avoid trying. It can help to distinguish genuine risk from the discomfort of possibly making a mistake.","• What specifically am I afraid of in relation to my goal?\n• Which consequences are realistic, and which am I imagining?\n• What can I prepare to help me handle potential difficulties?","Choose one fear and write a simple plan for what you would do if it actually happened."],
  ["When we think about a new goal, we often focus on what we lack. Yet our past experiences, skills and coping strategies can provide a useful starting point. You do not need to know everything to use what you already have.","• What skills have I developed through work, relationships or everyday life?\n• Which could help me with my current direction?\n• When have I handled something that initially seemed difficult?","Choose one skill you already have and write down exactly how you can use it in your next step."],
  ["Lacking a skill does not necessarily mean your goal is out of reach. It may simply point to something worth learning. Naming a specific gap makes it easier to plan for.","• What do I need to learn to move forward?\n• Is the gap in knowledge, practice, experience or support?\n• What would be the simplest way to begin learning?","Choose one specific thing to learn and plan your first step: a short lesson, a conversation, some practice or finding a reliable source."],
  ["Past experiences can shape what we expect. If something did not work out before, we may assume a similar situation will always end the same way. But our skills, circumstances and opportunities can change.","• What past experience influences my current decisions?\n• What have I learned since then?\n• What is different today compared with then?","Choose one past experience and write down one lesson worth keeping and one pattern you no longer need to repeat."],
  ["Over time, we gain knowledge we did not have before. We may understand our reactions, needs and limitations better. Looking at the past from today's perspective can help us learn without unnecessary self-blame.","• What difficult past situation do I understand differently today?\n• What do I know now that I did not know then?\n• What words of support or practical advice would I offer my past self?","Write a few sentences to your past self. Focus on what you have learned rather than judging past decisions solely through today's knowledge."],
  ["Changing your mind does not always mean being inconsistent. Sometimes it means you have gained new information or understand yourself better. You can remain true to your values while changing your opinions, plans and methods.","• Which belief do I hold mainly because I have believed it for a long time?\n• What new information might change my perspective?\n• Am I afraid of how others might react if I changed my mind?","Identify one opinion or approach you could reconsider. You do not have to change it immediately; simply allow the possibility."],
  ["Each of us sees the world through our own experiences. Another perspective may reveal information we have missed. You do not need to agree with every viewpoint to learn something from it.","• In what situation do I find it difficult to consider another viewpoint?\n• How might the situation look from the other person's perspective?\n• What might I be missing because I am focused on my own point of view?","Choose one situation and describe it from two different perspectives. Notice what changes in your understanding."],
  ["Sometimes we wait until we stop feeling afraid before doing something important. Yet courage can mean acting consciously despite uncertainty, while taking genuine risks and our own boundaries into account.","• What would I like to do but feel held back from by fear?\n• Does this fear point to a specific danger or mainly the possibility of discomfort?\n• How could I approach this situation gradually and sensibly?","Choose one small step towards something that matters to you. Decide how you will protect your safety and boundaries as you take it."],
  ["When a situation repeats itself, we often respond in familiar ways, even when they do not produce good results. Change does not always require an entirely new plan. Sometimes it is enough to change one part of our response.","• What situation regularly triggers a similar response in me?\n• What do I usually do, and what is the result?\n• What alternative response might better serve my needs?","Prepare one specific alternative to your usual behaviour. Write down what you will do next time."],
  ["When we make overly ambitious promises to ourselves, they are easy to abandon, which can undermine our trust in our own plans. Small, realistic commitments give us a chance to discover what works and gradually build consistency.","• What promise do I often make to myself but struggle to keep?\n• Does it fit my actual circumstances and capacity?\n• How could I reduce it to a version that is easier to fulfil?","Make one small promise to yourself for the next 24 hours. Keep it specific and realistic."],
  ["Even after many days of personal work, old thoughts can return, especially in stressful situations. This does not necessarily mean you have made no progress. What matters is also whether you can notice them and choose how to respond.","• What old thought returns most often?\n• In what circumstances does it tend to appear?\n• What helps me avoid reacting automatically under its influence?","Prepare a short sentence to help interrupt an automatic reaction, such as: “I know this thought. I can check whether it is helpful before following it.”"],
  ["Independence does not mean having to manage everything without help. Support can take the form of a conversation, practical assistance, information or working together to find a solution. Asking for it is a skill we can develop.","• Do I find it easy to ask for help when I need it?\n• What holds me back?\n• Who might be able to offer the support I genuinely need?","Take one concrete step: ask a question, request help or speak to someone you trust."],
  ["Boundaries help protect our time, energy and values. They do not always mean saying no; they can mean setting conditions, defining priorities or clearly stating what you can agree to.","• Which of my current commitments does not fit what matters to me?\n• Am I agreeing willingly or mainly because I fear other people's reactions?\n• How could I express my boundary clearly and respectfully?","Prepare one sentence to communicate your boundary. Use it when an appropriate situation arises."],
  ["Understanding a new way of thinking is one step. Practising it is another. You do not have to respond perfectly. You can prepare in advance, try it and reflect afterwards.","• In what situation would I like to respond differently from usual?\n• What specific response would I like to try?\n• What could help me remember it in the moment?","Practise your new response aloud or write it down. If an appropriate opportunity arises, try it and notice the result."],
  ["Perfectionism can lead us to postpone action, overwork details or judge an entire effort by one mistake. Quality matters, but not every situation requires perfection. Sometimes a solution that fulfils its purpose is enough.","• In what area do I demand perfection from myself?\n• What do I lose by trying to make everything perfect?\n• What would a good-enough version of my action look like?","Choose one small task you have postponed because of excessive expectations. Set a reasonable standard and complete it without unnecessary polishing."],
  ["A shift in perspective does not always mean difficult thoughts have disappeared. You may understand them differently, notice them sooner or make different choices in response. Progress can be seen in how you respond, not only in the results you achieve.","• Which belief do I see differently now than I did at the beginning of this journey?\n• What helped me look at it from a new perspective?\n• How have my behaviour or decision-making changed?","Write down one change in your thinking and one real-life example of how it may help you."],
  ["During SEE, you practised examining beliefs, separating facts from interpretations and considering alternative responses. The aim is not to always think differently, but to have greater freedom to choose how you respond to your thoughts and experiences.","• Which practice has been most helpful to me?\n• What belief do I want to continue observing or questioning?\n• What do I do differently now compared with before this stage?\n• What skill do I want to carry into the next stage?","Choose one practice from SEE to return to in everyday life. Keep it simple and easy to use when you genuinely need it."],
  ["We often give more attention to what we do not want than to what we wish to create. Today, turn that perspective around. Do not focus on every obstacle or on how far you are from your goal. Direct your attention towards what you truly want.","We often give more attention to what we do not want than to what we wish to create.","Describe your desired outcome in a few sentences, using concrete images from everyday life. Return to this description when you notice yourself focusing only on problems again."],
  ["Behind many goals lies a desire for a particular feeling. We may want a career change, greater independence or a place of our own, but it also matters what we hope to experience: peace, freedom, satisfaction, security or pride. Understanding these emotions helps us recognise what truly matters to us.","Behind many goals lies a desire for a particular feeling.","Choose one feeling you associate with your goal. Consider how you can make a little more room for it today, without pretending that the goal has already been achieved."],
  ["What we focus on influences what we notice. When we see only obstacles, we may overlook available solutions, support or new opportunities. Focusing on a goal does not remove difficulties, but it can help us recognise more ways forward.","What we focus on influences what we notice.","When you next face a difficulty, ask yourself: “What options do I have?” Write down at least two answers before deciding what to do."],
  ["Imagine an ordinary day in which your desired change has become part of your life. Do not focus only on a dramatic moment of success. Notice the everyday details: your choices, behaviour, surroundings and the way you treat yourself. This vision can help you define your direction more clearly.","Imagine an ordinary day in which your desired change has become part of your life.","Write down three details from your vision of the future. Choose one that you can translate into a small change in your current everyday life."],
  ["A goal does not have to impress others, look good on paper or meet someone else's expectations. It should matter in your life. When you understand why you chose it, it becomes easier to return to what matters, even when doubts arise.","A goal does not have to impress others, look good on paper or meet someone else's expectations.","Complete the sentence: “This goal matters to me because…”. Keep your answer as a personal reminder of the direction you are choosing. ## Część II. BECOME — Stań się Dni 76–80 · Days 76–80 W tej części przenosimy uwagę na tożsamość. Nie pytamy już tylko, co chcesz osiągnąć, ale także, jaką osobą chcesz się stawać w procesie realizacji swojego celu. Nie chodzi o udawanie ani odgrywanie roli, lecz o rozwijanie sposobu myślenia i zachowania, który wspiera wybrany kierunek."],
  ["We often define ourselves by what we have achieved, what we lack or what has not worked out. Yet we can also consciously develop qualities that help us create the life we want. A goal concerns an outcome, but change is also about the person we become along the way.","We often define ourselves by what we have achieved, what we lack or what has not worked out.","Choose one quality you want to develop. Consider how it could show up in one ordinary situation during the next 24 hours."],
  ["We make many small decisions every day. Not all of them matter greatly, but some gradually move us towards our goal while others take us away from what matters. A conscious choice begins by asking whether a decision supports the life we want to create. This does not mean always choosing the hardest path or giving up rest and enjoyment.","We make many small decisions every day.","Before one decision today, pause and ask: “Does this choice support the direction I have chosen?” Then make a conscious decision that also takes your needs and real circumstances into account."],
  ["Sometimes we think we must feel ready before we can act. Yet confidence often develops through experience rather than before it. Being ready does not have to mean having no fear, doubts or uncertainty. It can mean deciding that you are ready to take the next sensible step, even when you do not yet have all the answers.","Sometimes we think we must feel ready before we can act.","Complete the sentence: “I do not have to wait until I feel completely ready. Today, I decide to…”. Finish it with a specific, sensible action."],
  ["The person we want to become is not defined by success alone. How we treat ourselves when things do not go as planned matters too. We can treat a difficulty as information rather than proof of our incompetence. We can take responsibility for our actions without being merciless towards ourselves.","The person we want to become is not defined by success alone.","Prepare one sentence to help you respond to a difficulty more constructively, for example: “This is not the outcome I wanted. I can explore what it teaches me and decide what to do next.”"],
  ["Sometimes we hold on to old descriptions of ourselves: “I have always been this way”, “I am not the kind of person who does that” or “That is not for me”. These statements may describe past experiences, but they do not have to define your entire future. You can keep what you value about yourself while developing new ways of acting.","Sometimes we hold on to old descriptions of ourselves: “I have always been this way”, “I am not the kind of person who does that” or “That is not for me”.","Write down one old statement about yourself and replace it with a more open, realistic one. You do not have to fully believe it yet; treat it as a possibility you can explore through experience. ## Część III. CHOOSE — Wybieraj świadomie Dni 81–85 · Days 81–85 W tej części uczestniczka ćwiczy kierowanie uwagi na wybrany cel i podejmowanie decyzji, które są z nim zgodne. Nie chodzi o kontrolowanie każdej myśli ani podporządkowanie całego życia jednemu rezultatowi. Chodzi o świadome wybieranie tego, czemu poświęcamy czas, energię i uwagę."],
  ["Our attention is a limited resource. What we focus on influences the information we notice, the opportunities we consider and the actions we take. If we constantly focus on what we do not want, we may lose sight of what we are trying to create. Directing attention towards a goal does not mean ignoring problems. It means problems do not have to occupy all our attention.","Our attention is a limited resource.","Choose one short question to help direct your attention towards your goal, such as: “What matters most right now for the direction I have chosen?” Return to it when you notice yourself becoming distracted or focusing only on problems."],
  ["Every day, we choose how to spend our time, who to spend it with and which commitments to accept. Some choices support our goals, while others consume resources we need to pursue them. Choosing consciously also means recognising what to let go of, what to simplify and where we need to set a boundary.","Every day, we choose how to spend our time, who to spend it with and which commitments to accept.","Choose one thing you can reduce, simplify or decline to make more room for what genuinely matters to you."],
  ["We cannot control everything that enters our minds or everything that happens around us. However, we can practise deciding where to direct our attention next. We can notice a worry, acknowledge its presence and then return to the task, conversation or action that matters to us.","We cannot control everything that enters our minds or everything that happens around us.","When you notice your attention drifting today, pause and consciously choose where you want to direct it. Do not judge yourself for becoming distracted; treat returning your attention as a practice."],
  ["Our lives are shaped not only by major decisions but also by the small choices we make regularly. Not every decision has to lead directly to a goal, and rest, relationships and spontaneity matter too. It is worth recognising when we choose consciously and when we act purely out of habit, fear or pressure.","Our lives are shaped not only by major decisions but also by the small choices we make regularly.","For one decision today, consider its short-term and long-term consequences. Choose the option that best fits your values, needs and direction."],
  ["A conscious choice does not have to be a one-time decision. We can regularly remind ourselves why something matters to us. We may also discover that our needs have changed and that we need to adjust our direction. Consistency does not mean clinging to a plan that no longer serves us.","A conscious choice does not have to be a one-time decision.","Write one sentence reaffirming your current direction or identify what you want to change. Do not make a decision solely to escape temporary discomfort; give yourself room to choose thoughtfully. ## Część IV. LIVE IT — Żyj tą zmianą Dni 86–90 · Days 86–90 Ostatnie pięć dni łączy nową perspektywę z codziennym doświadczeniem. Uczestniczka uczy się traktować błędy jako informacje, wracać do wybranego kierunku i budować własny sposób życia. Celem nie jest perfekcja ani stałe odczuwanie motywacji, ale świadome kontynuowanie zmiany."],
  ["When something does not work, we may treat it as proof that we are not capable of achieving our goal. But we can look at the situation differently: the outcome has given us information about our method, preparation or circumstances. A mistake does not always mean we should continue in the same way. Sometimes it means we need to try differently.\n\nThomas Edison is often associated with the idea that he did not experience failures but discovered ways that did not work. The important lesson is not the number of attempts, but whether we can learn from them.","When something does not work, we may treat it as proof that we are not capable of achieving our goal.","Choose one experience that did not produce the outcome you expected. Write down what you learned, what you will change and what you will try next time."],
  ["Sometimes we imagine that a confident, successful or fulfilled person always feels good. In reality, emotions change with circumstances, tiredness and experience. You do not have to feel enthusiastic every day to keep acting in line with your values. You can experience doubt and still know what matters to you.","Sometimes we imagine that a confident, successful or fulfilled person always feels good.","Choose one small action that aligns with your direction. If you have sufficient energy and resources, take it regardless of your mood. If you need rest, treat caring for yourself as a conscious decision, not a failure."],
  ["Life brings periods when we lose focus, change priorities or stop acting in line with our intentions. This is a natural part of everyday life. What matters is not only whether we can maintain our direction without interruption, but also how we return to it and with what attitude.","Life brings periods when we lose focus, change priorities or stop acting in line with our intentions.","Choose one sentence or question that will help you return to your direction. It could be: “What genuinely matters to me right now?” Write it down and place it somewhere you will easily notice it."],
  ["Reaching a goal matters, but so does how we live while pursuing it. We may postpone our sense of fulfilment until everything is finally in place. Yet we can already develop behaviours, relationships and habits that reflect the values we want to nurture. We do not have to wait for perfect circumstances to begin living more consciously.","Reaching a goal matters, but so does how we live while pursuing it.","Choose one value you want to express consciously today. Do something concrete that reflects it — through your work, a conversation, rest or a decision. ## Dzień 90. Staję się częścią własnej zmiany Day 90. Becoming Part of My Own Change"],
  ["My inner and outer worlds are increasingly coherent.","Imagine your values, words, habits and environment fitting together.","Imagine that one year has passed. You are now living the reality you want to create today. Not everything has to be perfect, but something important has changed. You make different decisions, see yourself and your possibilities differently, and your everyday life increasingly reflects what truly matters to you.\n\nWrite a letter to yourself today, but from the perspective of that future version of you.\n\nDo not focus on how difficult the journey was or on every step you had to take. Describe your new reality. What does your life look like? How do you feel? What has become natural to you? What decisions do you make? What do you appreciate now, and what no longer has the same hold over you as it once did?\n\nWrite in the present tense, as if you are describing a life you are already living. You might begin: “I am writing to you from the future. I want you to know what my life looks like now…”\n\nGo beyond material things or specific achievements. Include your emotions, relationships, everyday habits, sense of self-worth and the way you make decisions.\n\nKeep this letter. Return to it in 3, 6 or 12 months. Read it again and notice what has happened since you wrote it. What has changed? What have you achieved? What turned out differently from what you imagined? Who have you become?\n\nDo not judge yourself by whether everything happened exactly as you described. Treat the letter as a record of your vision at that moment and a reference point that can help you recognise your real growth."],
;

function polishForGender(value){
  if(language!=="pl" || gender!=="male" || typeof value!=="string") return value;
  const pairs=[
    ["pełną spokojnej pewności","pełnego spokojnego przekonania"],
    ["zrobiłaby ją","zrobiłby ją"],
    ["Stworzyłam","Stworzyłem"],["stworzyłam","stworzyłem"],
    ["zauważyłam","zauważyłem"],["Zauważyłam","Zauważyłem"],
    ["zauważyłaś","zauważyłeś"],["Zauważyłaś","Zauważyłeś"],
    ["zauważyła","zauważył"],["Zauważyła","Zauważył"],
    ["robiącą","robiącego"],["odkładałaś","odkładałeś"],
    ["poradziłaś","poradziłeś"],["znałaś","znałeś"],["znalazłaś","znalazłeś"],
    ["mogłaś","mogłeś"],["chciałaś","chciałeś"],["wybrałaś","wybrałeś"],
    ["przeoczyć","przeoczyć"],
    ["wyobraziłam","wyobraziłem"],["Wyobraziłam","Wyobraziłem"],
    ["wybrałam","wybrałem"],["Wybrałam","Wybrałem"],
    ["stworzyłam","stworzyłem"],["Stworzyłam","Stworzyłem"],
    ["przeszłaś","przeszedłeś"],["pragnęłaś","pragnąłeś"],
    ["stałam","stałem"],["zintegrowałam","zintegrowałem"],
    ["zaczęłam","zacząłem"],["zrobiłam","zrobiłem"],["byłam","byłem"],
    ["czułam","czułem"],["miałam","miałem"],["chciałam","chciałem"],
    ["mogłam","mogłem"],["widziałam","widziałem"],["wybrałam","wybrałem"],
    ["wdzięczna","wdzięczny"],["przekonana","przekonany"],
    ["obecna","obecny"],["spokojna","spokojny"],["gotowa","gotowy"],
    ["silna","silny"],["pewna","pewny"],["sama","sam"],
    ["wdzięczną","wdzięcznym"],["obecną","obecnym"],
    ["spokojną","spokojnym"],["gotową","gotowym"],["pewną","pewnym"],
    ["pełna","pełny"],["przygotowana","przygotowany"],
    ["wybrałam","wybrałem"],["którą wybrałam","który wybrałem"],
    ["osobą, którą się stałam","osobą, którą się stałem"],
    ["nauczyłaś","nauczyłeś"],["zauważyłaś","zauważyłeś"],
    ["mogłabyś","mógłbyś"],["brałaś","brałeś"],
    ["odkładałaś","odkładałeś"],["zrobiłabyś","zrobiłbyś"],
    ["zrobiłaś","zrobiłeś"],["miałaś","miałeś"],
    ["byłaś","byłeś"],["czułaś","czułeś"],["chciałaś","chciałeś"]
  ];
  let out=value;
  for(const [from,to] of pairs) out=out.split(from).join(to);
  return out;
}
function activePolishDays(){
  return daysPL.map(day=>day.map(polishForGender));
}
function choosePolishGender(value){
  gender=value;
  localStorage.setItem("smmGender",gender);
  fillIntro("pl");
  document.querySelectorAll(".instruction-notice [data-en][data-pl]").forEach(el=>{el.textContent=el.dataset.pl;});
  updateAuthUI(currentSession);
  updateStorageNote();
  showScreen("welcomeScreen");

  "Zauważ swój obecny nastrój bez potrzeby jego zmieniania. Pozwól sobie być tam, gdzie jesteś dzisiaj.",

  "Daj sobie chwilę ciszy. Zauważ, że zmiana nie musi być wielkim wydarzeniem. Może przejawiać się w zwyczajnych decyzjach, które podejmujesz każdego dnia.",
